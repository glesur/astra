[Grid]
X1-grid    -@lx1@  @resx1@  @lx1@
X2-grid    -@lx2@  @resx2@  @lx2@
X3-grid    -@lx3@  @resx3@  @lx3@

[TimeIntegrator]
method  rk3
cfl   1.0
tstop 4.0
max_runtime  0.15 # 10 minutes

[Physics]
rhs mhd
viscosity  1e-4
resistivity 1e-4
omega 1.0
shear_type linear
shear_rate 1.5

[InitFlow]
large_scale_3d_noise 1.0e-1  0.5 # Amplitude and cut-off length
mean_field  0.0 0.0 3.0e-2       # Mean field in each direction (note: beta = 2*omega^2*H^2/b^2, so this corresponds to beta ~ 2222 )

[Output]
log 100
